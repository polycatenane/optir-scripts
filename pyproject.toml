[project]
name = "optir-scripts"
version = "0.1.0"
description = "Marimo notebooks for O-PTIR hyperspectral cell analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marimo>=0.24.0",
    "matplotlib>=3.11.1",
    "numpy>=2.2.4,<2.6",  # older NumPy warns when pandas hashes histogram Interval bins
    "pandas>=2.3,<3",
    "scipy>=1.18",
]

[project.optional-dependencies]
cells = [
    "accelerate>=1.14.0",
    "cellpose==3.1.1.3",
    "torch>=2.0",
]
particles = [
    "anybioimage>=0.3.1",
    "scikit-image>=0.26",
    "zarr",  # anybioimage 0.3.1 imports zarr without declaring it
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
# cellpose 3.1.1.3 declares numpy<2.1, but this project needs NumPy's Interval-cast fix.
override-dependencies = ["numpy>=2.2.6,<2.6"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
# PyPI only ships CPU torch on Windows; use CUDA 13.2 builds on Linux and Windows.
torch = { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
